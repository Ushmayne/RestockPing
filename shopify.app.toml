# App configuration, pushed to Shopify by `shopify app dev` / `shopify app deploy`.
# https://shopify.dev/docs/apps/tools/cli/configuration

# Public identifier (it also appears in the App Bridge meta tag). The secret never lives here.
client_id = "1bb7d5d74652c34404b096d4c664fe7d"
name = "RestockPing"
# Placeholder. `shopify app dev` swaps in the tunnel URL (automatically_update_urls_on_dev).
application_url = "https://shopify.dev/apps/default-app-home"
embedded = true

[webhooks]
# Payload version for webhook deliveries. Kept equal to config.api_version in Rails so
# webhooks and GraphQL responses use the same schema.
api_version = "2026-10"

# App-specific subscriptions: Shopify subscribes every shop that installs the app,
# and `shopify app dev` applies them to the dev store. A relative uri resolves
# against application_url, so it survives tunnel URL changes.
[[webhooks.subscriptions]]
topics = [ "inventory_levels/update", "app/uninstalled" ]
# Mandatory privacy webhooks for App Store apps.
compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]
uri = "/api/webhooks"

[access_scopes]
# Shopify shows exactly these on the install screen (managed installation).
# read_orders gets added in Phase 5, when we actually need it.
scopes = "read_products,read_inventory"
# false = Shopify handles install and scope grants, and we authenticate with token exchange.
# true would bring back the old OAuth redirect dance through /auth/callback.
use_legacy_install_flow = false

[auth]
# Only used by the legacy OAuth flow. Kept because the CLI expects the key to be present.
redirect_urls = [ "https://shopify.dev/apps/default-app-home/api/auth" ]

[build]
include_config_on_deploy = true
automatically_update_urls_on_dev = true
